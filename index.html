<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PV do Churras – Cardápio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#163a16;--bg2:#143514;--gold:#d4af5f;--gold-hi:#f3dc98;--cream:#efe6cf;--muted:#c4dcc0;--line:rgba(212,175,95,.3);
--serif:"Cormorant Garamond","Georgia",serif;--sans:"Jost","Segoe UI",system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg2);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--sans);font-weight:300;color:var(--cream);background:radial-gradient(ellipse 120% 60% at 50% 0%,var(--bg) 0%,var(--bg) 35%,var(--bg2) 100%) fixed;min-height:100vh;overflow-x:hidden}
main,header,footer,nav{position:relative;z-index:2}

/* fundo de churrasco */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%}

/* hero */
.hero{text-align:center;padding:44px 20px 34px}
h1{margin:0;line-height:0}
.logo{position:relative;display:inline-block}
.logo::before{content:"";position:absolute;inset:-30px -10px;background:radial-gradient(circle,rgba(243,220,152,.28),transparent 65%);animation:glow 3.5s ease-in-out infinite alternate}
.logo img{position:relative;display:block;width:min(86vw,420px);height:auto;filter:drop-shadow(0 6px 22px rgba(0,0,0,.35));animation:enter 1.4s cubic-bezier(.2,.8,.2,1) both}
.lead{margin:6px auto 0;max-width:420px;font:italic 500 21px/1.4 var(--serif);color:var(--cream);opacity:.9;animation:fade 1s 1s both}
.cue{display:block;width:1px;height:44px;margin:26px auto 0;background:linear-gradient(var(--gold),transparent);transform-origin:top;animation:cue 2s 1.4s ease-in-out infinite}

/* nav */
.wrap{width:min(100%,760px);margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,48,18,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 12px;max-width:900px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:400 15px/1 var(--sans);letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:19px 12px;cursor:pointer;transition:color .3s}
.tab:hover,.tab[aria-current=true]{color:var(--cream)}
.ind{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:transform .45s cubic-bezier(.3,.8,.2,1),width .45s cubic-bezier(.3,.8,.2,1);box-shadow:0 0 10px var(--gold)}
.prog{position:absolute;left:0;right:0;top:0;height:1px;background:var(--gold);transform-origin:0 0;transform:scaleX(var(--p,0));opacity:.8}
.tab:focus-visible{outline:2px solid var(--gold-hi);outline-offset:-4px}

/* seções */
section{padding:60px 0 8px}
.sh{text-align:center;margin-bottom:20px}
.sh h2{margin:0;font:600 clamp(34px,9vw,46px)/1.1 var(--serif);color:var(--gold-hi)}
.sh p{margin:6px 0 0;font:italic 500 19px/1.3 var(--serif);color:var(--muted)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.orn::before,.orn::after{content:"";width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.it{padding:18px 14px;border-bottom:1px solid rgba(212,175,95,.12);transition:background .4s}
.it:hover{background:linear-gradient(90deg,rgba(212,175,95,.09),transparent 85%)}
.top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.top h3{margin:0;font:600 25px/1.15 var(--serif);color:var(--cream)}
.dots{flex:1;border-bottom:1px dotted rgba(212,175,95,.45);transform:translateY(-4px);min-width:12px}
.pr{display:flex;gap:6px 18px;flex-wrap:wrap;margin-left:auto}
.pr span{font:500 21px/1 var(--serif);color:var(--gold-hi);white-space:nowrap}
.pr small{font:300 13px var(--sans);color:var(--muted);margin-right:6px}
.it p{margin:6px 0 0;font-size:15px;line-height:1.55;color:var(--muted);max-width:60ch}
footer{padding:48px 20px 70px;text-align:center}
.note{margin:0 auto;max-width:520px;font:italic 500 17px/1.5 var(--serif);color:var(--muted)}

@keyframes enter{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

      p.t += dt; if (p.t > p.life) { P[i] = plume(false); return; }

      x.save(); x.translate(p.x0 + Math.sin(p.t * .28 + p.ph) * w * .09, h * 1.15 - k * h * 1.5);
      x.rotate(p.rot + p.t * p.dr); x.scale(1, p.sy); x.globalAlpha = a;
      x.drawImage(p.tex, -p.sz / 2, -p.sz / 2, p.sz, p.sz); x.restore();
    });
  }
  if (reduce) { draw(0); return; }
  (function loop(now) { var dt = Math.min((now - last) / 1000, .05); last = now; draw(dt); requestAnimationFrame(loop); })(last);
})();
</script>
